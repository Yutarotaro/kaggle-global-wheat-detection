seed = 42
require_trial_commits = true
baseline_reference = "8fc98f3e68e8441a-0001"
baseline_hypothesis = "COCO事前学習済みFaster R-CNN ResNet-50 FPN v2をKaggle元データ2,002枚で学習する。MobileNetV3版と比べ、比較的高解像度の入力と強いFPNで小さい穂の検出と枠精度が改善するか。"
runtime_s = 6900
agent_s = 600
smoke_s = 180
evaluate_s = 300
poll_s = 15
editable = ["configs/fasterrcnn-resnet50-v2.json"]

[selection]
group_metric = "by_source"
max_group_regression = 0.01

[agent]
type = "config-sweep"
aggregate_only = true
path = "configs/fasterrcnn-resnet50-v2.json"

[[agent.variants]]
hypothesis = "全体画像と拡大クロップを混ぜて、FPNの小さい穂の再現率を上げられるか。"
overrides = {run_label = "frcnn-r50v2-6e-768-zoom50", zoom_crop_probability = 0.5}

[executor]
type = "kaggle"
owner = "yutarotaro"
binary = ".venv/bin/kaggle"
competition = "global-wheat-detection"
notebook_prefix = "wheat-train"
notebook_label_file = "configs/fasterrcnn-resnet50-v2.json"
notebook_exclude_dirs = ["docs", "notebooks", "scripts", "tests", ".github"]
accelerator = "NvidiaTeslaT4"
internet = true

[task]
type = "command"
interpreter = ".venv/bin/python"
metric = "wheat_image_precision"
direction = "max"
train = ["python", "src/wheat/train.py", "--config", "configs/fasterrcnn-resnet50-v2.json", "--epoch-previews", "--epoch-scores"]
smoke = ["python", "src/wheat/train.py", "--config", "configs/fasterrcnn-resnet50-v2.json", "--smoke"]
evaluate = ["python", "src/wheat/evaluate.py"]
dataset_manifest = "data/prepared/split.json"
remote_inputs = ["data/prepared/split.json"]
