seed = 42
require_trial_commits = true
runtime_s = 2700
agent_s = 600
smoke_s = 120
evaluate_s = 600
poll_s = 10
editable = ["configs/baseline.json", "src/wheat/model.py", "src/wheat/preprocess.py", "src/wheat/train.py"]

[agent]
type = "codex"
aggregate_only = true

[executor]
type = "kaggle"
owner = "yutarotaro"
binary = ".venv/bin/kaggle"
dataset_sources = ["yutarotaro/ml-loop-gwhd2020-v4"]
accelerator = "NvidiaTeslaT4"
internet = true

[task]
type = "command"
interpreter = ".venv/bin/python"
metric = "gwhd2020_v4_image_precision"
direction = "max"
train = ["python", "src/wheat/train.py", "--data-source", "gwhd2020-v4"]
smoke = ["python", "src/wheat/train.py", "--smoke"]
evaluate = ["python", "src/wheat/evaluate.py", "--data-source", "gwhd2020-v4"]
dataset_manifest = "data/gwhd2020-v4/split.json"
remote_inputs = ["data/gwhd2020-v4/split-remote.json"]
