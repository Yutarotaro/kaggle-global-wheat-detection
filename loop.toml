seed = 42
target_score = 0.9
require_trial_commits = true
baseline_reference = "8fc98f3e68e8441a-0001"
baseline_hypothesis = "6 epochに短縮して、12 epoch学習で見えたvalid lossの上昇を抑えながら検出スコアを維持できるか確認する。"
runtime_s = 2700
agent_s = 600
smoke_s = 120
evaluate_s = 300
poll_s = 10
editable = ["configs/baseline.json", "src/wheat/model.py", "src/wheat/preprocess.py", "src/wheat/train.py"]

[agent]
type = "config-sweep"
aggregate_only = true
path = "configs/baseline.json"

[agent.fallback]
type = "codex"
aggregate_only = true
research_brief = """
Target 0.90 on the fixed validation competition metric. Use the reported score and recall by box size.
The 640px MobileNetV3 baseline scored 0.44510 at 3 epochs and 0.51296 at 12 epochs. The 12-epoch validation loss was lowest at epoch 4.
At 3 epochs background classification weight 1.25 improved by 0.00652. Adding box regression weight 1.20, positive classification weight 1.10, or a background weight warmup all worsened that parent. Avoid repeating those changes without a new hypothesis.
Filtering the saved 12-epoch predictions at confidence 0.50 improved validation to 0.52579. This is exploratory validation evidence, not a holdout or leaderboard score.
Prefer one controlled change at a time. Try input resolution, learning rate, detector backbones, and inference thresholds. Keep validation loss, epoch previews, and optimizer-step logging. Keep validation separate. Update run_label in configs/baseline.json with the condition. The 45-minute runtime includes training and final prediction.
"""

[[agent.variants]]
hypothesis = "Moderate color jitter helps transfer between fields with different lighting."
overrides = {run_label = "mbv3-6e-640-color15", color_jitter = 0.15}

[[agent.variants]]
hypothesis = "Vertical flipping improves robustness to camera orientation."
overrides = {run_label = "mbv3-6e-640-vflip50", vertical_flip = 0.5}

[executor]
type = "kaggle"
owner = "yutarotaro"
binary = ".venv/bin/kaggle"
competition = "global-wheat-detection"
notebook_prefix = "wheat-train"
notebook_label_file = "configs/baseline.json"
notebook_exclude_dirs = ["docs/figures"]
accelerator = "NvidiaTeslaT4"
internet = true

[task]
type = "command"
interpreter = ".venv/bin/python"
metric = "wheat_image_precision"
direction = "max"
train = ["python", "src/wheat/train.py", "--epoch-previews"]
smoke = ["python", "src/wheat/train.py", "--smoke"]
evaluate = ["python", "src/wheat/evaluate.py"]
dataset_manifest = "data/prepared/split.json"
remote_inputs = ["data/prepared/split.json"]
